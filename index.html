
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garden of Memories</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#b7c6de;font-family:system-ui;color:#354763}
canvas{display:block}
header{position:fixed;top:calc(22px + env(safe-area-inset-top));left:22px;pointer-events:none}
h1{font:32px Georgia,serif;margin:7px 0}
header small{letter-spacing:2px;font-size:10px}
header p{font-size:12px}
#notice{position:fixed;top:160px;left:8%;width:84%;text-align:center;background:#fff9;padding:11px;border-radius:25px;font-size:12px;z-index:7}
#controls{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;border-radius:24px;background:#fffdf1ed;padding:16px;box-shadow:0 12px 50px #44557755;z-index:9}
#controls h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{border:0;background:#e7eaf1;border-radius:12px;padding:10px 2px;color:#415471;font-size:11px}
.grid b{display:block;font-size:23px}
#start{float:right;background:#779bc4;color:white;border:0;padding:9px;border-radius:12px}
#state{font-size:11px;color:#6c7d90;margin-top:9px}
#video{position:fixed;top:25px;right:18px;width:90px;height:115px;object-fit:cover;transform:scaleX(-1);border-radius:15px;display:none;z-index:8}
#handDot{position:fixed;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9px #fff7a344,0 0 35px #ffe3a4;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:6}
#debug{position:fixed;top:calc(150px + env(safe-area-inset-top));right:12px;background:#27384edb;color:white;padding:8px 12px;border-radius:12px;font-size:11px;z-index:7;max-width:210px;white-space:pre-line}
#memory{position:fixed;top:36%;left:50%;width:80vw;max-width:340px;transform:translate(-50%,-50%);background:#fff9;border-radius:24px;padding:24px;text-align:center;display:none;box-shadow:0 15px 60px #52658355;z-index:10}
#memory h2{font:28px Georgia,serif}
#memory button{border:0;border-radius:12px;background:#8aacc9;padding:12px 25px}
</style>
</head>
<body>
<header>
<small>THE GARDEN OF MEMORIES</small>
<h1>Mochi's Garden</h1>
<p>梦幻自然主义 · 低多边形三维纪念花园</p>
</header>

<div id="notice">用手势让回忆之花绽放</div>
<video id="video" autoplay muted playsinline></video>
<div id="handDot"></div>
<div id="debug">等待启动手部追踪</div>

<div id="memory">
<div style="font-size:70px">🐈</div>
<h2>Dear Mochi</h2>
<p>记得那个阳光落在你耳朵上的下午。</p>
<button onclick="document.querySelector('#memory').style.display='none'">返回花园</button>
</div>

<div id="controls">
<button id="start">开启摄像头</button>
<h3>Gesture Magic</h3>
<div class="grid">
<button data-g="palm"><b>✋</b>花朵绽放</button>
<button data-g="pinch"><b>🤏</b>捏合献花</button>
<button data-g="point"><b>☝️</b>打开回忆</button>
<button data-g="fist"><b>✊</b>祝福光点</button>
</div>
<div id="state">也可触摸按钮演示 · 拖动旋转花园</div>
</div>

<script type="module">
import * as T from 'https://esm.sh/three@0.169.0';

const scene=new T.Scene();
scene.background=new T.Color('#b7c8e3');
scene.fog=new T.FogExp2('#b7c8e3',.025);

const cam=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
cam.position.set(0,6,15);
cam.lookAt(0,1,0);

const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=T.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new T.HemisphereLight(0xffffff,0x738ca3,3));
const sun=new T.DirectionalLight(0xfff0d6,3);
sun.position.set(-5,10,8);
scene.add(sun);

const material=c=>new T.MeshStandardMaterial({color:c,flatShading:true,roughness:.83});

function m(g,c,x,y,z,parent=scene){
  let o=new T.Mesh(g,material(c));
  o.position.set(x,y,z);
  parent.add(o);
  return o;
}

m(new T.CylinderGeometry(5.2,3.7,1.4,11),'#96b9a5',0,-1,0);
m(new T.CylinderGeometry(3.7,2.4,1.2,11),'#8b9b9d',0,-2,0);
m(new T.CylinderGeometry(1.5,1.7,.25,9),'#f0e2d8',0,0,0);

const flowers=[];

function flower(x,z,s=1){
  let g=new T.Group();
  g.position.set(x,.15,z);
  scene.add(g);

  m(new T.CylinderGeometry(.05,.07,.8,5),'#7aa893',0,.35,0,g);

  let petals=[];
  for(let i=0;i<6;i++){
    let a=i*Math.PI/3;
    let p=m(
      new T.IcosahedronGeometry(.32,0),
      i%2?'#f0cddd':'#c8d9f0',
      Math.cos(a)*.28,.93,Math.sin(a)*.28,g
    );
    p.scale.set(.9,1.35,.8);
    petals.push(p);
  }

  m(new T.IcosahedronGeometry(.18,1),'#ffe2a4',0,.93,0,g);
  g.scale.setScalar(s);
  flowers.push({g,petals,s});
}

flower(0,0,1.7);

for(let i=0;i<29;i++){
  let a=i*2.399;
  let r=1.9+Math.sqrt(i/29)*2.7;
  flower(Math.cos(a)*r,Math.sin(a)*r,.35+Math.random()*.24);
}

function tree(x,z){
  m(new T.CylinderGeometry(.1,.15,1.3,6),'#b6a398',x,.65,z);
  m(new T.IcosahedronGeometry(.95,0),'#d2e1cd',x,1.6,z);
}

tree(-3,-2);
tree(3,-2);

let motes=[];
for(let i=0;i<30;i++){
  let o=m(
    new T.IcosahedronGeometry(.035+Math.random()*.06,0),
    '#fff0b9',
    (Math.random()-.5)*9,
    Math.random()*4,
    (Math.random()-.5)*9
  );
  motes.push(o);
}

let bloom=0,target=0,angle=0,down=null,burst=0,offering=0;
const debug=document.querySelector('#debug');
const dot=document.querySelector('#handDot');
const notice=document.querySelector('#notice');
const video=document.querySelector('#video');
const state=document.querySelector('#state');

function action(g){
  document.querySelector('#memory').style.display='none';

  if(g==='palm'){
    target=1;
    notice.textContent='✋ 花朵绽放 · 记忆被唤醒';
  }

  if(g==='pinch'){
    target=1;
    offering=1;
    notice.textContent='🤏 献上一朵花 · 思念化作光点';
    motes.forEach(o=>{
      o.position.y=Math.random()*2;
      o.position.x=(Math.random()-.5)*4;
    });
  }

  if(g==='point'){
    target=1;
    notice.textContent='☝️ 打开珍藏的回忆';
    document.querySelector('#memory').style.display='block';
  }

  if(g==='fist'){
    burst=1;
    notice.textContent='✊ 祝福化作星光';
    target=0;
    motes.forEach(o=>{
      o.position.y=Math.random()*4;
      o.position.x=(Math.random()-.5)*6;
    });
  }

  state.textContent='当前手势：'+g;
}

document.querySelectorAll('[data-g]').forEach(
  b=>b.onclick=()=>action(b.dataset.g)
);

renderer.domElement.onpointerdown=e=>down=e.clientX;
renderer.domElement.onpointermove=e=>{
  if(down!==null){
    angle+=(e.clientX-down)*.006;
    down=e.clientX;
  }
};
renderer.domElement.onpointerup=()=>down=null;

function frame(t){
  requestAnimationFrame(frame);

  bloom+=(target-bloom)*.045;
  burst*=.97;
  offering*=.97;

  flowers.forEach((f,i)=>{
    f.g.rotation.y=Math.sin(t*.0006+i)*.06;
    f.g.scale.setScalar(
      f.s*(i===0?1+bloom*.8:1+offering*.35)
    );

    f.petals.forEach((p,j)=>{
      let a=j*Math.PI/3;
      p.position.x=Math.cos(a)*(.28+(i===0?bloom*.18:0));
      p.position.z=Math.sin(a)*(.28+(i===0?bloom*.18:0));
    });
  });

  motes.forEach((o,i)=>{
    o.position.y+=.003+burst*.09+Math.sin(t*.001+i)*.002;
    if(o.position.y>5)o.position.y=0;
  });

  cam.position.x=Math.sin(angle)*15;
  cam.position.z=Math.cos(angle)*15;
  cam.lookAt(0,1,0);
  renderer.render(scene,cam);
}

requestAnimationFrame(frame);

onresize=()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
};

let detector;
let previous=-1;
let candidate='';
let count=0;
let lastAt=0;
let detected=0;

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function classify(l){
  const fingers=[
    [8,6,5],
    [12,10,9],
    [16,14,13],
    [20,18,17]
  ];

  const ext=fingers.map(
    ([tip,pip,mcp])=>
      dist(l[tip],l[mcp])>dist(l[pip],l[mcp])*1.30
  );

  const n=ext.filter(Boolean).length;
  const width=Math.max(dist(l[5],l[17]),.04);
  const pinch=dist(l[4],l[8])/width;

  if(pinch<.32){
    return {name:'pinch',details:'pinch='+pinch.toFixed(2)+' fingers='+n};
  }
  if(n>=4){
    return {name:'palm',details:'extended='+n};
  }
  if(ext[0]&&!ext[1]&&!ext[2]&&!ext[3]){
    return {name:'point',details:'index extended'};
  }
  if(n===0){
    return {name:'fist',details:'folded=4'};
  }
  return {
    name:null,
    details:'extended='+n+' pinch='+pinch.toFixed(2)
  };
}

function loadScript(url,timeout=18000){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    let done=false;
    const timer=setTimeout(
      ()=>finish(new Error('加载超时：'+url)),
      timeout
    );

    function finish(err){
      if(done)return;
      done=true;
      clearTimeout(timer);
      s.onload=s.onerror=null;
      err?reject(err):resolve();
    }

    s.onload=()=>finish();
    s.onerror=()=>finish(new Error('脚本下载失败：'+url));
    s.src=url;
    document.head.appendChild(s);
  });
}

async function loadVision(){
  if(window.vision?.HandLandmarker)return window.vision;
  if(window.MediaPipeTasksVision?.HandLandmarker){
    return window.MediaPipeTasksVision;
  }

  const url=new URL(
    './mediapipe/vision_bundle.js',
    document.baseURI
  ).href;

  debug.textContent='正在加载手势引擎…\n'+url;
  await loadScript(url);

  if(window.vision?.HandLandmarker)return window.vision;
  if(window.MediaPipeTasksVision?.HandLandmarker){
    return window.MediaPipeTasksVision;
  }

  throw new Error('脚本已加载，但未找到 HandLandmarker');
}

async function start(){
  const b=document.querySelector('#start');
  b.disabled=true;
  state.textContent='正在申请权限并加载模型…';
  debug.textContent='加载 MediaPipe…';

  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw Error('请通过 HTTPS 打开网页并允许相机权限');
    }

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:false
    });

    video.srcObject=stream;
    video.style.display='block';
    await video.play();

    const mp=await loadVision();

    debug.textContent='手势引擎已加载 · 正在初始化本地 WASM';

    const files=await mp.FilesetResolver.forVisionTasks(
      new URL('./mediapipe/wasm/',document.baseURI).href
    );

    debug.textContent='WASM 已就绪 · 正在加载本地手部模型';

    detector=await mp.HandLandmarker.createFromOptions(files,{
      baseOptions:{
        modelAssetPath:new URL(
          './mediapipe/hand_landmarker.task',
          document.baseURI
        ).href,
        delegate:'CPU'
      },
      runningMode:'VIDEO',
      numHands:1,
      minHandDetectionConfidence:.45,
      minHandPresenceConfidence:.45,
      minTrackingConfidence:.45
    });

    state.textContent='模型已加载：把整只手放在前置摄像头画面中央';
    debug.textContent='模型已就绪 · 等待手部';
    b.textContent='识别中';
    requestAnimationFrame(track);

  }catch(e){
    state.textContent='识别未启动：'+e.message+'。模拟按钮仍可使用';
    debug.textContent='启动失败：'+e.message;
    b.disabled=false;
    b.textContent='重试';
  }
}

function track(){
  if(video.readyState>=2&&video.currentTime!==previous){
    previous=video.currentTime;

    try{
      const result=detector.detectForVideo(video,performance.now());
      const l=result.landmarks?.[0];

      if(l){
        detected++;

        const point=l[9];
        dot.style.display='block';

        const rect=video.getBoundingClientRect();
        dot.style.left=(rect.left+(1-point.x)*rect.width)+'px';
        dot.style.top=(rect.top+point.y*rect.height)+'px';

        const reading=classify(l);
        const g=reading.name;

        if(g===candidate){
          count++;
        }else{
          candidate=g;
          count=1;
        }

        debug.textContent=
          '✓ 已检测到手部\n'+
          '当前手势：'+(g||'过渡动作')+
          ' · 连续 '+count+' 帧\n'+
          reading.details+
          '\n识别帧：'+detected;

        if(g&&count>=5&&performance.now()-lastAt>1300){
          action(g);
          lastAt=performance.now();
          debug.textContent+='\n✓ 已触发花园动画';
        }

      }else{
        candidate='';
        count=0;
        dot.style.display='none';
        debug.textContent=
          '未检测到手 · 请让整只手进入镜头\n'+
          '光线充足，手距约30–60cm';
      }

    }catch(e){
      debug.textContent='追踪错误：'+e.message;
    }
  }

  requestAnimationFrame(track);
}

document.querySelector('#start').onclick=start;
window.demoGesture=action;
</script>
</body>
</html>
